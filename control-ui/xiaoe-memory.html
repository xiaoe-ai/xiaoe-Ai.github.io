<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XiaoE">
<link rel="manifest" href="/xiaoe-app.webmanifest">
<title>XiaoE Memory</title>
<style>
:root{--bg:#050816;--panel:#0b1224;--line:rgba(120,140,255,.22);--text:#f7f8ff;--muted:#9ea9c4;--purple:#7b47ff;--blue:#2f7cff;--cyan:#20d4eb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#050816,#071022 62%,#040713);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100dvh}.wrap{width:min(820px,100%);margin:auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;gap:10px}.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:#0b1329;color:#fff;font-size:21px}.title{font-size:24px;font-weight:800}.pill{margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:#8eeeff;font-size:11px}.hero{padding:22px 2px 14px}.hero h1{margin:0;font-size:31px;background:linear-gradient(90deg,var(--purple),var(--blue),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.45}.toolbar{display:flex;gap:8px;margin-bottom:12px}.search{flex:1;height:44px;border:1px solid var(--line);border-radius:14px;background:#0a1329;color:#fff;padding:0 13px;outline:none;font-size:15px}.filter{height:44px;border:1px solid var(--line);border-radius:14px;background:#0a1329;color:#cfd7ef;padding:0 12px}.list{display:grid;gap:10px}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(14,24,49,.97),rgba(8,15,32,.98));padding:14px}.cardTop{display:flex;gap:8px;align-items:flex-start}.card h3{margin:0;font-size:15px;line-height:1.35}.importance{margin-left:auto;white-space:nowrap;border-radius:999px;background:rgba(123,71,255,.18);padding:4px 8px;color:#d7caff;font-size:10px}.content{margin-top:8px;color:#c8d1e8;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.meta{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}.tag{border:1px solid rgba(120,140,255,.18);border-radius:999px;padding:4px 7px;color:#95a5cb;font-size:9px}.empty{border:1px dashed rgba(120,140,255,.28);border-radius:18px;padding:28px 18px;text-align:center;color:var(--muted);font-size:13px}.error{color:#ff98a6}.login{position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,6,18,.97);padding:20px;z-index:50}.login.hidden{display:none}.loginCard{width:min(400px,100%);border:1px solid var(--line);border-radius:22px;background:#0c1630;padding:22px}.loginCard h2{margin:0 0 8px}.loginCard p{margin:0 0 14px;color:var(--muted);font-size:12px}.loginCard input{width:100%;height:49px;border:1px solid var(--line);border-radius:13px;background:#071027;color:#fff;padding:0 12px;margin-bottom:9px;font-size:16px}.loginCard button{width:100%;height:49px;border:0;border-radius:13px;background:linear-gradient(90deg,#743eff,#2f7cff,#20d4eb);color:#fff;font-weight:800}.loginError{margin-top:9px;color:#ff98a6;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><button class="back" id="back" type="button">‹</button><div class="title">Memory</div><div class="pill" id="status">Checking…</div></header>
<section class="hero"><h1>XiaoE Memory</h1><p>只读查看 XiaoE 自己的长期记忆。当前版本不编辑、不删除、不自动写入。</p></section>
<div class="toolbar"><input class="search" id="search" placeholder="搜索标题、内容、Project、Tag"><select class="filter" id="filter"><option value="all">全部</option><option value="global">Global</option><option value="project">Project</option></select></div>
<div class="list" id="list"><div class="empty">正在读取记忆…</div></div>
</div>
<div class="login" id="login"><div class="loginCard"><h2>Login XiaoE</h2><p>使用 XiaoE 自己的账号读取 Memory。</p><input id="email" type="email" autocomplete="username" value="eri_evo@yahoo.com" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="loginBtn" type="button">Login</button><div class="loginError" id="loginError"></div></div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://uuqiwyqxllqsuboogbxh.supabase.co','sb_publishable_FHfn50t7yu0kq6qhhLtshQ_Vb6imElO');
const $=id=>document.getElementById(id);let rows=[];
$('back').onclick=()=>location.href='/control-ui/xiaoe-universal-home-v1.html';
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const filtered=rows.filter(r=>{const project=r.project_key||'';const bucket=project?'project':'global';if(f!=='all'&&bucket!==f)return false;const hay=[r.title,r.content,r.project_key,r.namespace,r.memory_type,...(r.tags||[])].join(' ').toLowerCase();return !q||hay.includes(q)});if(!filtered.length){$('list').innerHTML=`<div class="empty">${rows.length?'没有符合条件的记忆。':'XiaoE 新 Memory 目前还是空的。'}</div>`;return}$('list').innerHTML=filtered.map(r=>`<article class="card"><div class="cardTop"><h3>${esc(r.title||'Untitled memory')}</h3><span class="importance">Importance ${Number(r.importance||0)}</span></div><div class="content">${esc(r.content||'')}</div><div class="meta">${r.project_key?`<span class="tag">Project: ${esc(r.project_key)}</span>`:'<span class="tag">Global</span>'}${r.memory_type?`<span class="tag">${esc(r.memory_type)}</span>`:''}${(r.tags||[]).slice(0,6).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></article>`).join('')}
async function load(){const {data:{session}}=await supabase.auth.getSession();if(!session){$('login').classList.remove('hidden');$('status').textContent='Not connected';return}const {data:member,error:memberError}=await supabase.from('xiaoe_members').select('role,status').eq('user_id',session.user.id).maybeSingle();if(memberError||!member||member.status!=='active'){await supabase.auth.signOut();$('login').classList.remove('hidden');$('loginError').textContent='This account is not an active XiaoE member.';return}$('login').classList.add('hidden');$('status').textContent=`${member.role||'member'} · Read only`;const {data,error}=await supabase.from('memories').select('id,title,content,importance,project_key,namespace,memory_type,tags,updated_at').eq('is_active',true).order('importance',{ascending:false}).order('updated_at',{ascending:false}).limit(100);if(error){$('list').innerHTML=`<div class="empty error">Memory read failed: ${esc(error.message)}</div>`;return}rows=data||[];render()}
$('loginBtn').onclick=async()=>{$('loginError').textContent='';const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent=error.message;return}await load()};$('search').addEventListener('input',render);$('filter').addEventListener('change',render);supabase.auth.onAuthStateChange(()=>load());load();
</script>
</body>
</html>
