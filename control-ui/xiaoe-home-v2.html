<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050716">
<title>Xiao_E · Evolution Workspace</title>
<style>
:root{--bg:#050716;--panel:#0b1430;--line:rgba(96,120,255,.28);--text:#f7f8ff;--muted:#aeb8d8;--blue:#4a7dff;--cyan:#20d7eb;--purple:#9a4dff;--danger:#ff8c9d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(160deg,#040614,#081126 52%,#030612);color:var(--text)}
body{min-height:100dvh}.wrap{width:min(980px,100%);margin:auto;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;height:54px;border-bottom:1px solid rgba(100,124,255,.2)}.brand{font-size:25px;font-weight:850}.pill{font-size:11px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--cyan)}
.hero{text-align:center;padding:24px 8px 18px}.hero h1{margin:0;font-size:clamp(31px,7vw,48px);background:linear-gradient(90deg,var(--purple),var(--blue),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{margin:8px 0 0;color:#dbe1f5;font-size:13px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{min-height:96px;border:1px solid var(--line);border-radius:18px;padding:14px;background:linear-gradient(145deg,rgba(15,24,57,.95),rgba(6,13,34,.98));color:#fff;text-align:left}.card b{display:block;margin-top:10px;font-size:15px}.card span{display:block;color:#b9c4e0;font-size:11px;line-height:1.4;margin-top:4px}.icon{font-size:20px}.purple{color:#c34fff}.cyan{color:#21d9e6}.mainCard{grid-column:1/-1;min-height:74px;display:flex;align-items:center;gap:12px;background:linear-gradient(145deg,rgba(28,49,94,.95),rgba(8,20,46,.98))}.mainCard .icon{font-size:23px}.mainCard b{margin:0}.mainCard .copy{min-width:0;flex:1}.mainCard .arrow{margin-left:auto;font-size:22px;color:#72dfff}
.chat{margin-top:12px;border-radius:19px;overflow:hidden;border:1px solid rgba(98,121,255,.3);background:#fff;min-height:390px;display:flex;flex-direction:column}.messages{flex:1;min-height:290px;max-height:50dvh;overflow:auto;padding:14px;color:#15203d}.row{display:flex;margin:0 0 10px}.row.user{justify-content:flex-end}.bubble{max-width:88%;padding:10px 11px;border-radius:14px;background:#f1f4ff;line-height:1.45;font-size:13px;white-space:pre-wrap;word-break:break-word}.row.user .bubble{background:linear-gradient(135deg,#7e4cff,#3979ff);color:#fff}.meta{font-size:9px;color:#8994b2;margin-top:5px}.composer{border-top:1px solid #e5e9f4;padding:9px;background:#fff}.composer textarea{width:100%;height:58px;resize:none;border:1px solid #dbe1ef;border-radius:14px;padding:10px;font-size:16px;color:#17203b;outline:none}.actions{display:flex;gap:8px;margin-top:7px;align-items:center}.mode{height:38px;border:1px solid #d8deef;border-radius:12px;background:#fff;padding:0 11px}.send{margin-left:auto;width:44px;height:44px;border:0;border-radius:14px;color:#fff;background:linear-gradient(145deg,#6d31ff,#3478ff 58%,#14cfe5);font-size:18px}
.overlay{position:fixed;inset:0;background:rgba(2,4,12,.9);backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px;z-index:20}.login{width:min(470px,100%);padding:24px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(145deg,#171747,#071332)}.login h2{margin:0 0 7px}.login p{margin:0 0 16px;color:#bdc7e1;font-size:13px;line-height:1.45}.login input{width:100%;height:49px;border-radius:13px;border:1px solid rgba(110,130,255,.3);background:#06102c;color:#fff;padding:0 13px;margin-bottom:10px;font-size:16px}.login button{width:100%;height:49px;border:0;border-radius:13px;background:linear-gradient(90deg,#9256ff,#4c8eff,#28dce8);color:#fff;font-weight:800}.error{min-height:20px;margin-top:10px;color:var(--danger);font-size:12px}.hidden{display:none!important}.logout{border:1px solid var(--line);background:rgba(255,255,255,.03);color:#fff;border-radius:12px;padding:8px 10px}
@media(min-width:760px){.card{min-height:110px}.wrap{padding-top:24px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand">Xiao_E˙◡˙</div><div style="display:flex;gap:8px;align-items:center"><div class="pill" id="authPill">XiaoE Auth</div><button class="logout" id="logout">↪</button></div></header>
  <section class="hero"><h1>Evolution Voucher</h1><p>Project Workspace · Read only</p></section>
  <section class="cards">
    <button class="card" data-action="evolution_summary"><div class="icon purple">↗</div><b>Project Overview</b><span>今日核销、Top Partner、Branch 概况</span></button>
    <button class="card" id="quickSearch"><div class="icon cyan">⌕</div><b>Quick Search</b><span>直接输入 Voucher、Partner、Branch 或问题</span></button>
    <button class="card mainCard" id="openEvolutionMain"><div class="icon cyan">▦</div><div class="copy"><b>Open Evolution Main</b><span>进入 Evolution Voucher 正式系统</span></div><div class="arrow">›</div></button>
  </section>
  <section class="chat"><div class="messages" id="messages"></div><div class="composer"><textarea id="message" placeholder="Ask Xiao_E about Evolution..."></textarea><div class="actions"><button class="mode">◉ Evolution · Read only</button><button class="send" id="send">➤</button></div></div></section>
</div>
<div class="overlay" id="overlay"><div class="login"><h2>Login Xiao_E˙◡˙</h2><p>Use your XiaoE Owner account. Evolution data is accessed through the verified read-only connector.</p><input id="email" type="email" value="eri_evo@yahoo.com" autocomplete="username"><input id="password" type="password" placeholder="XiaoE Owner password" autocomplete="current-password"><button id="login">Login XiaoE Owner</button><div class="error" id="error"></div></div></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const XIAOE_URL='https://uuqiwyqxllqsuboogbxh.supabase.co';
const XIAOE_KEY='sb_publishable_FHfn50t7yu0kq6qhhLtshQ_Vb6imElO';
const CONNECTOR='https://hukihbcyyqhanaqrizvm.supabase.co/functions/v1/xiaoe-evolution-connector';
const EVOLUTION_MAIN='https://xiaoe-ai.github.io/evolution-optical-voucher/';
const supabase=createClient(XIAOE_URL,XIAOE_KEY);const $=id=>document.getElementById(id);
function add(text,who='bot',meta=''){const row=document.createElement('div');row.className='row'+(who==='user'?' user':'');const b=document.createElement('div');b.className='bubble';b.textContent=text;if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;b.appendChild(m)}row.appendChild(b);$('messages').appendChild(row);$('messages').scrollTop=$('messages').scrollHeight}
function format(p){let out=p.answer||'Query completed.';if(Array.isArray(p.by_branch)&&p.by_branch.length)out+='\n\n'+p.by_branch.map(x=>`${x.branch_name}: ${x.count}`).join('\n');else if(Array.isArray(p.data)&&p.data.length)out+='\n\n'+p.data.slice(0,12).map((x,i)=>`${i+1}. ${x.partner_name||x.branch_name||x.voucher_code||JSON.stringify(x)}${x.count!=null?` · ${x.count}`:''}`).join('\n');else if(p.status_counts)out+='\n\n'+Object.entries(p.status_counts).map(([k,v])=>`${k}: ${v}`).join('\n');return out}
async function session(){return (await supabase.auth.getSession()).data.session}
async function render(){const s=await session();$('overlay').classList.toggle('hidden',!!s);$('authPill').textContent=s?'XiaoE Owner · Connected':'XiaoE Auth';if(s&&$('messages').children.length===0)add('Evolution Project 已连接。你可以直接查询 Voucher、Partner、Branch、Redemption，或先看 Project Overview。','bot','Evolution · Read only')}
async function call(action,message=''){const s=await session();if(!s){await render();throw new Error('XiaoE session required')}const res=await fetch(CONNECTOR,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.access_token}`},body:JSON.stringify({action,message})});const p=await res.json().catch(()=>({success:false,error:'Invalid response'}));if(!res.ok||p.success===false)throw new Error(p.error||'Query failed');return p}
$('login').onclick=async()=>{$('error').textContent='';$('login').disabled=true;const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';$('login').disabled=false;if(error){$('error').textContent=error.message;return}await render()};
$('logout').onclick=async()=>{await supabase.auth.signOut();location.reload()};
document.querySelectorAll('[data-action]').forEach(btn=>btn.onclick=async()=>{try{const p=await call(btn.dataset.action);add(format(p),'bot',p.action)}catch(e){add('Query failed: '+e.message,'bot','system')}});
$('quickSearch').onclick=()=>{$('message').focus()};
$('openEvolutionMain').onclick=()=>{location.href=EVOLUTION_MAIN};
async function send(){const q=$('message').value.trim();if(!q)return;add(q,'user');$('message').value='';$('message').blur();try{const p=await call('',q);add(format(p),'bot',p.action)}catch(e){add('Query failed: '+e.message,'bot','system')}}
$('send').onclick=send;$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});supabase.auth.onAuthStateChange(()=>render());render();
</script>
</body></html>
