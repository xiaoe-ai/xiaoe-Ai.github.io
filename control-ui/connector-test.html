<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>XiaoE Connector Test</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#0b1020;color:#f5f7ff;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(620px,100%);background:#11182b;border:1px solid #2b3a64;border-radius:18px;padding:24px}
    h1{margin:0 0 8px}.muted{color:#aeb9d5;font-size:14px;line-height:1.5}
    input,button{width:100%;box-sizing:border-box;margin-top:12px;padding:12px 14px;border-radius:10px;font-size:16px}
    input{border:1px solid #35446f;background:#0a0f1f;color:white}
    button{border:0;font-weight:700;cursor:pointer}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    .row.three{grid-template-columns:repeat(3,1fr)}
    .status{margin-top:16px;white-space:pre-wrap;font-size:14px;line-height:1.5;background:#0a0f1f;border-radius:10px;padding:12px;min-height:48px;overflow:auto;max-height:50vh}
    .ok{color:#9be59b}.err{color:#ff9e9e}
    @media(max-width:620px){.row,.row.three{grid-template-columns:1fr 1fr}.row.three button:last-child{grid-column:1/-1}}
  </style>
</head>
<body>
  <main class="card">
    <h1>XiaoE → Evolution Connector Test</h1>
    <div class="muted">Uses XiaoE Auth only. Tests read-only access to Evolution through the new connector. No create, update, delete or redeem actions are available here.</div>

    <input id="email" type="email" value="eri_evo@yahoo.com" readonly />
    <input id="password" type="password" placeholder="XiaoE Owner password" autocomplete="current-password" />
    <button id="login">Login XiaoE Owner</button>

    <div class="row">
      <button class="testBtn" id="health" disabled>Test Health</button>
      <button class="testBtn" id="branches" disabled>Test Branch List</button>
    </div>

    <div class="row three">
      <button class="testBtn" id="summary" disabled>Evolution Summary</button>
      <button class="testBtn" id="partners" disabled>Top Partners</button>
      <button class="testBtn" id="overview" disabled>Branch Overview</button>
    </div>

    <div id="status" class="status">Not connected.</div>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const XIAOE_URL = 'https://uuqiwyqxllqsuboogbxh.supabase.co';
    const XIAOE_KEY = 'sb_publishable_FHfn50t7yu0kq6qhhLtshQ_Vb6imElO';
    const CONNECTOR_URL = 'https://hukihbcyyqhanaqrizvm.supabase.co/functions/v1/xiaoe-evolution-connector';
    const supabase = createClient(XIAOE_URL, XIAOE_KEY);

    const $ = (id) => document.getElementById(id);
    const setStatus = (msg, cls='') => { $('status').className = 'status ' + cls; $('status').textContent = msg; };
    const setTestsEnabled = (enabled) => document.querySelectorAll('.testBtn').forEach(btn => btn.disabled = !enabled);

    async function getSession() {
      const { data: { session } } = await supabase.auth.getSession();
      return session;
    }

    async function callConnector(action) {
      const session = await getSession();
      if (!session) { setStatus('No XiaoE session. Please login first.', 'err'); return; }
      setStatus(`Calling ${action}...`);
      const res = await fetch(CONNECTOR_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ action })
      });
      const data = await res.json().catch(() => ({ error: 'Invalid JSON response' }));
      setStatus(JSON.stringify(data, null, 2), res.ok && data?.success ? 'ok' : 'err');
    }

    $('login').addEventListener('click', async () => {
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!password) { setStatus('Enter your XiaoE Owner password.', 'err'); return; }
      $('login').disabled = true;
      setStatus('Logging in to XiaoE Auth...');
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      $('password').value = '';
      $('login').disabled = false;
      if (error) { setStatus('Login failed: ' + error.message, 'err'); return; }
      if (!data?.session) { setStatus('Login did not create a session.', 'err'); return; }
      setTestsEnabled(true);
      setStatus('XiaoE Owner login successful. Run the v2 read-only tests.', 'ok');
    });

    $('health').addEventListener('click', () => callConnector('health'));
    $('branches').addEventListener('click', () => callConnector('branch_list'));
    $('summary').addEventListener('click', () => callConnector('evolution_summary'));
    $('partners').addEventListener('click', () => callConnector('top_partners'));
    $('overview').addEventListener('click', () => callConnector('branch_overview'));

    const existing = await getSession();
    if (existing) {
      setTestsEnabled(true);
      setStatus('Existing XiaoE session found. Run the v2 read-only tests.', 'ok');
    }
  </script>
</body>
</html>
