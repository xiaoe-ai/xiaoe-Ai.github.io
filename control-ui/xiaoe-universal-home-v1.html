<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050816">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="/xiaoe-app.webmanifest">
<title>XiaoE Universal Home v1</title>
<style>
:root{--bg:#050816;--panel:#0b1224;--line:rgba(120,140,255,.22);--text:#f7f8ff;--muted:#9ea9c4;--blue:#2f7cff;--purple:#7b47ff;--cyan:#20d4eb;--ink:#17213d;--safe-bottom:env(safe-area-inset-bottom,0px);--keyboard-h:0px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}body{position:fixed;inset:0;overscroll-behavior:none;touch-action:manipulation}button,input,textarea{font:inherit}button{cursor:pointer}.shell{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 18% 0%,rgba(55,103,255,.10),transparent 24%),radial-gradient(circle at 92% 16%,rgba(124,64,255,.10),transparent 24%),linear-gradient(180deg,#050816,#071022 62%,#040713)}.page{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px calc(10px + var(--safe-bottom));overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}.brand{display:flex;align-items:center;gap:10px;font-size:27px;font-weight:800;letter-spacing:-.7px}.brandMark{width:38px;height:38px;border-radius:14px;background:linear-gradient(145deg,#2f7cff,#7b47ff);display:grid;place-items:center;font-size:23px;box-shadow:0 0 22px rgba(70,90,255,.24)}.status{display:flex;align-items:center;gap:7px;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:12px;color:#c7d3f3;background:rgba(255,255,255,.02)}.dot{width:7px;height:7px;border-radius:50%;background:#24e5a5;box-shadow:0 0 10px rgba(36,229,165,.6)}.hero h1{margin:0;font-size:25px;line-height:1.2}.hero p{margin:5px 0 0;color:var(--muted);font-size:13px}.core{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.core button{min-width:0;border:1px solid var(--line);border-radius:17px;padding:13px 7px;background:linear-gradient(180deg,rgba(16,25,52,.94),rgba(8,15,32,.98));color:var(--text);text-align:center}.core .icon{display:block;font-size:23px;margin-bottom:6px}.core .label{display:block;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.core .sub{display:none}.workspace{min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;overflow:hidden}.sectionTitle{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:750}.sectionTitle small{color:var(--muted);font-weight:500}.projectCard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(12,22,45,.96),rgba(7,14,29,.98));padding:12px 14px;color:inherit;width:100%;text-align:left}.projectIcon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#1f5dff,#7250ff);font-size:19px}.projectText{min-width:0;flex:1}.projectName{font-size:14px;font-weight:750}.projectMeta{margin-top:3px;font-size:11px;color:var(--muted)}.tasks{border:1px solid var(--line);border-radius:17px;background:rgba(11,18,36,.95);overflow:hidden}.taskToggle{width:100%;border:0;background:transparent;color:var(--text);padding:13px 14px;display:flex;align-items:center;gap:10px;text-align:left}.taskToggle strong{flex:1}.count{min-width:26px;height:26px;border-radius:999px;display:grid;place-items:center;background:rgba(123,71,255,.22);color:#d7caff;font-size:12px}.chev{transition:transform .18s ease}.tasks.open .chev{transform:rotate(180deg)}.taskList{display:none;border-top:1px solid rgba(120,140,255,.12);padding:4px 14px 10px}.tasks.open .taskList{display:block}.task{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px;color:#d8def0}.task:last-child{border-bottom:0}.chat{min-height:0;border:1px solid rgba(116,91,255,.72);border-radius:22px;background:#fff;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) auto;box-shadow:0 0 0 1px rgba(47,124,255,.24),0 10px 28px rgba(0,0,0,.18);position:relative}.messages{min-height:0;overflow-y:auto;overflow-x:hidden;padding:15px 15px 8px;color:var(--ink);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.message{width:fit-content;max-width:90%;padding:11px 12px;border-radius:14px;background:#f1f4ff;border:1px solid #e3e8fb;font-size:13px;line-height:1.45}.message.user{margin-left:auto;background:linear-gradient(135deg,#7050ff,#347cff);color:#fff;border:0}.meta{margin-top:5px;font-size:9px;color:#8d98b6}.composer{background:#fff;border-top:1px solid #e7ebf4;padding:9px 10px 10px;position:relative;z-index:5}.inputWrap{position:relative}.input{display:block;width:100%;height:64px;max-height:64px;resize:none;overflow-y:auto;border:0;outline:0;background:#fff;color:var(--ink);padding:9px 66px 8px 4px;font-size:16px;line-height:1.4;-webkit-user-select:text;user-select:text}.input::placeholder{color:#929ab0}.send{position:absolute;right:0;bottom:2px;width:52px;height:52px;border:0;border-radius:16px;background:linear-gradient(145deg,#6e35ff,#2f7cff 62%,#20d4eb);color:#fff;font-size:20px;display:grid;place-items:center;box-shadow:0 8px 18px rgba(47,124,255,.22);touch-action:manipulation;z-index:20}.send:disabled{opacity:.55}.composerBar{display:flex;align-items:center;justify-content:space-between;margin-top:6px}.mode{border:1px solid #dfe4f1;border-radius:999px;background:#fff;color:#5b56e8;padding:8px 11px;font-size:11px}.hint{font-size:10px;color:#98a1b7}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;min-height:58px;border:1px solid rgba(120,140,255,.14);border-radius:20px;background:rgba(7,14,29,.96);padding:5px 18px}.bottom button{border:0;background:transparent;color:#adb6cf;font-size:11px}.bottom .home{color:#7760ff}.plus{width:48px;height:48px;border-radius:50%;margin:auto;background:linear-gradient(145deg,#7451ff,#2f7cff)!important;color:#fff!important;font-size:28px!important}
body.keyboard-open .composer{position:fixed;left:16px;right:16px;bottom:max(2px,calc(var(--keyboard-h) - 2px));z-index:999;border:1px solid #dfe5f2;border-radius:20px 20px 14px 14px;box-shadow:0 12px 28px rgba(0,0,0,.24)}body.keyboard-open .bottom{visibility:hidden}body.keyboard-open .chat{overflow:visible}body.keyboard-open .messages{padding-bottom:120px}
.loginOverlay{position:fixed;inset:0;z-index:5000;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,rgba(3,6,18,.96),rgba(5,8,22,.99))}.loginOverlay.hidden{display:none}.loginCard{width:min(420px,100%);border:1px solid rgba(120,140,255,.24);border-radius:24px;padding:24px;background:linear-gradient(180deg,#0d1731,#081126);box-shadow:0 28px 60px rgba(0,0,0,.34)}.loginCard h2{margin:0 0 7px;font-size:25px}.loginCard p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.45}.loginInput{width:100%;height:52px;border:1px solid rgba(120,140,255,.24);border-radius:15px;margin:0 0 10px;padding:0 14px;background:#071027;color:#fff;outline:0;font-size:16px}.loginBtn{width:100%;height:52px;border:0;border-radius:15px;background:linear-gradient(90deg,#743eff,#2f7cff 56%,#20d4eb);color:#fff;font-weight:800}.loginError{min-height:18px;margin-top:10px;color:#ff92a1;font-size:12px}
@media(min-width:720px){.page{width:min(820px,100%);margin:auto}.core .sub{display:block;margin-top:4px;font-size:10px;color:var(--muted)}}@media(max-height:720px){.page{gap:8px;padding-top:calc(8px + env(safe-area-inset-top))}.hero p{display:none}.core button{padding:10px 6px}.projectCard{padding:9px 12px}.bottom{min-height:50px}.plus{width:42px;height:42px}}
</style>
</head>
<body>
<div class="shell">
<main class="page">
<header class="top"><div class="brand"><span class="brandMark">◡</span><span>XiaoE</span></div><div class="status"><span class="dot"></span><span id="statusText">Checking…</span></div></header>
<section class="hero"><h1 id="heroTitle">你好，XiaoE 👋</h1><p id="heroSub">正在确认 XiaoE 身份…</p></section>
<section class="core" aria-label="Core modules">
<button type="button" id="projectsBtn"><span class="icon">📁</span><span class="label">项目</span><span class="sub">Projects</span></button>
<button type="button" id="assistantBtn"><span class="icon">◉</span><span class="label">助手</span><span class="sub">Assistant</span></button>
<button type="button" id="brainBtn"><span class="icon">🧠</span><span class="label">AI 大脑</span><span class="sub">Brain</span></button>
<button type="button" id="memoryBtn"><span class="icon">◇</span><span class="label">记忆</span><span class="sub">Memory</span></button>
</section>
<section class="workspace">
<div class="sectionTitle"><span>我的项目</span><small>查看全部 ›</small></div>
<button class="projectCard" id="evolutionProject" type="button"><div class="projectIcon">▦</div><div class="projectText"><div class="projectName">Evolution Voucher</div><div class="projectMeta">Project Workspace · Read only</div></div><div>›</div></button>
<div class="tasks" id="tasks"><button class="taskToggle" id="taskToggle" type="button" aria-expanded="false"><span>☑</span><strong>今日任务</strong><span class="count">3</span><span class="chev">⌄</span></button><div class="taskList"><div class="task">跟进重要项目事项</div><div class="task">准备今日所需资料</div><div class="task">Review 项目进度</div></div></div>
</section>
<section class="chat"><div class="messages" id="messages"><div class="message">你好，我是 XiaoE。这里是通用工作空间，项目只是其中一个模块。<div class="meta">Universal Home · XiaoE Auth</div></div></div><div class="composer"><div class="inputWrap"><textarea class="input" id="messageInput" placeholder="问 XiaoE 任何问题…" rows="2"></textarea><button class="send" id="sendBtn" type="button" aria-label="Send">➤</button></div><div class="composerBar"><button class="mode" type="button">◉ 智能模式⌄</button><span class="hint">发送后自动收起键盘</span></div></div></section>
<nav class="bottom"><button class="home" type="button">⌂<br>首页</button><button class="plus" type="button">＋</button><button type="button">●<br>我的</button></nav>
</main>
</div>
<div class="loginOverlay" id="loginOverlay"><div class="loginCard"><h2>Login XiaoE</h2><p>使用 XiaoE 自己的账号登录。Evolution 是其中一个 Project，不再作为 XiaoE 的身份系统。</p><input id="email" class="loginInput" type="email" autocomplete="username" value="eri_evo@yahoo.com" placeholder="Email"><input id="password" class="loginInput" type="password" autocomplete="current-password" placeholder="Password"><button id="loginBtn" class="loginBtn" type="button">Login</button><div id="loginError" class="loginError"></div></div></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const XIAOE_URL='https://uuqiwyqxllqsuboogbxh.supabase.co';
const XIAOE_KEY='sb_publishable_FHfn50t7yu0kq6qhhLtshQ_Vb6imElO';
const EVOLUTION_CONNECTOR='https://hukihbcyyqhanaqrizvm.supabase.co/functions/v1/xiaoe-evolution-connector';
const supabase=createClient(XIAOE_URL,XIAOE_KEY);
const $=(id)=>document.getElementById(id);
const input=$('messageInput'),sendBtn=$('sendBtn'),messages=$('messages'),tasks=$('tasks'),taskToggle=$('taskToggle');
let sendLocked=false;let startupAnnounced=false;let stableViewportHeight=Math.max(window.innerHeight,window.visualViewport?.height||0);
function addMessage(text,who='bot',meta=''){const el=document.createElement('div');el.className='message'+(who==='user'?' user':'');el.textContent=text;if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;el.appendChild(m)}messages.appendChild(el);messages.scrollTop=messages.scrollHeight}
async function loadXiaoECore(){const {data,error}=await supabase.from('memories').select('id,title,memory_type,importance,updated_at').eq('is_active',true).is('project_key',null).order('importance',{ascending:false}).order('updated_at',{ascending:false});if(error)throw error;const required=['XiaoE Persona and Behavior','XiaoE Command Rules v2','XiaoE Core - Current Architecture State'];const titles=new Set((data||[]).map(x=>x.title));const missing=required.filter(x=>!titles.has(x));if(missing.length)throw new Error('Missing required Core Memory: '+missing.join(', '));return data||[]}
async function renderIdentity(){const {data:{session}}=await supabase.auth.getSession();if(!session){startupAnnounced=false;$('loginOverlay').classList.remove('hidden');$('statusText').textContent='Not connected';$('heroTitle').textContent='你好，XiaoE 👋';$('heroSub').textContent='请先登录 XiaoE。';return}const {data:member,error}=await supabase.from('xiaoe_members').select('role,status,display_name').eq('user_id',session.user.id).maybeSingle();if(error||!member||member.status!=='active'){await supabase.auth.signOut();$('loginOverlay').classList.remove('hidden');$('loginError').textContent='This account is not an active XiaoE member.';return}const role=member.role?member.role.charAt(0).toUpperCase()+member.role.slice(1):'Member';$('statusText').textContent=`${role} · Loading…`;$('heroTitle').textContent=`你好，${member.display_name||'XiaoE Owner'} 👋`;$('heroSub').textContent='正在加载 XiaoE Core Memory…';$('loginOverlay').classList.add('hidden');try{const core=await loadXiaoECore();$('statusText').textContent=`${role} · Ready · ${core.length} Core loaded`;$('heroSub').textContent='XiaoE Core Memory 已加载，工作模式就绪。';if(!startupAnnounced){addMessage('小E上线啦～开工～～😎✨','bot',`Startup · ${core.length} Core Memory loaded`);startupAnnounced=true}}catch(e){console.error('XiaoE startup memory load failed:',e);$('statusText').textContent=`${role} · Memory load failed`;$('heroSub').textContent='XiaoE Core Memory 读取失败，当前不会标记为 Ready。';if(!startupAnnounced){addMessage('小E启动时没有完整读到 Core Memory，所以这次不算正式上线。','bot','Startup · Memory load failed');startupAnnounced=true}}}
$('loginBtn').addEventListener('click',async()=>{$('loginError').textContent='';const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('loginError').textContent='Please enter Email and Password.';return}$('loginBtn').disabled=true;$('loginBtn').textContent='Logging in…';const {error}=await supabase.auth.signInWithPassword({email,password});$('loginBtn').disabled=false;$('loginBtn').textContent='Login';if(error){$('loginError').textContent=error.message;return}await renderIdentity()});
$('evolutionProject').addEventListener('click',()=>location.href='/control-ui/xiaoe-home-v2.html');
$('projectsBtn').addEventListener('click',()=>$('evolutionProject').focus());
$('assistantBtn').addEventListener('click',()=>input.focus());
$('brainBtn').addEventListener('click',()=>location.href='/control-ui/brain-switch.html');
$('memoryBtn').addEventListener('click',()=>location.href='/control-ui/xiaoe-memory.html');
taskToggle.addEventListener('click',()=>{const open=tasks.classList.toggle('open');taskToggle.setAttribute('aria-expanded',String(open))});
function lockDocument(){document.documentElement.scrollLeft=0;document.body.scrollLeft=0;window.scrollTo(0,0)}
function syncKeyboard(){const vv=window.visualViewport;if(!vv)return;if(document.activeElement!==input)stableViewportHeight=Math.max(stableViewportHeight,window.innerHeight,vv.height+vv.offsetTop);const keyboard=Math.max(0,stableViewportHeight-(vv.height+vv.offsetTop));const open=document.activeElement===input&&keyboard>100;document.documentElement.style.setProperty('--keyboard-h',`${open?keyboard:0}px`);document.body.classList.toggle('keyboard-open',open);lockDocument()}
function closeKeyboardUI(){document.body.classList.remove('keyboard-open');document.documentElement.style.setProperty('--keyboard-h','0px');lockDocument()}
function releaseKeyboard(){try{input.blur()}catch(e){}setTimeout(closeKeyboardUI,100)}
function normalizeIntentText(text){return text.toLowerCase().replace(/\s+/g,' ').trim()}
function isEvolutionProgressIntent(text){const q=normalizeIntentText(text);const mentionsEvolution=q.includes('evolution')||q.includes('voucher system')||q.includes('voucher系统')||q.includes('包车系统');const progressWords=['进度','状态','做到哪里','做到哪','目前怎样','目前如何','现在怎样','现在如何','current state','progress','status'];return mentionsEvolution&&progressWords.some(x=>q.includes(x))}
function isEvolutionOpsIntent(text){const q=normalizeIntentText(text);const mentionsEvolution=q.includes('evolution')||q.includes('evolution voucher')||q.includes('voucher system')||q.includes('voucher系统')||q.includes('包车系统');const opsEntityWords=['redeem','redemption','核销','voucher','partner','branch','分行','门店'];const strongOps=['top partner','top branch','今天 redeem','今日 redeem','今天核销','今日核销','今天多少张','今日多少张','本月核销','这个月核销','本月 redemption','这个月 redemption','哪个 branch','哪间 branch','branch 最多','哪个门店','哪间门店','门店最多','哪个 partner','哪一个 partner','partner 最多'];return (mentionsEvolution&&opsEntityWords.some(x=>q.includes(x)))||strongOps.some(x=>q.includes(x))}
async function loadEvolutionProjectState(){const {data,error}=await supabase.from('memories').select('content,updated_at').eq('is_active',true).eq('project_key','evolution_voucher').eq('title','Evolution Voucher - Current Project State').maybeSingle();if(error)throw error;if(!data)throw new Error('Evolution current project state not found');return data}
async function callEvolutionConnector(message){const {data:{session}}=await supabase.auth.getSession();if(!session)throw new Error('XiaoE session required');const res=await fetch(EVOLUTION_CONNECTOR,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({action:'',message})});const payload=await res.json().catch(()=>({success:false,error:'Invalid connector response'}));if(!res.ok||payload.success===false)throw new Error(payload.error||'Evolution query failed');return payload}
function formatEvolutionPayload(p){let out=p.answer||'Evolution query completed.';if(Array.isArray(p.by_branch)&&p.by_branch.length)out+='\n\n'+p.by_branch.map(x=>`${x.branch_name}: ${x.count}`).join('\n');else if(Array.isArray(p.data)&&p.data.length)out+='\n\n'+p.data.slice(0,12).map((x,i)=>`${i+1}. ${x.partner_name||x.branch_name||x.voucher_code||JSON.stringify(x)}${x.count!=null?` · ${x.count}`:''}`).join('\n');else if(p.status_counts)out+='\n\n'+Object.entries(p.status_counts).map(([k,v])=>`${k}: ${v}`).join('\n');return out}
async function routeMessage(text){if(isEvolutionProgressIntent(text)){const state=await loadEvolutionProjectState();return {text:`Evolution Voucher 当前进度：\n\n${state.content}`,meta:'Project State · evolution_voucher'}}if(isEvolutionOpsIntent(text)){const p=await callEvolutionConnector(text);return {text:formatEvolutionPayload(p),meta:`Evolution · ${p.action||'Read only'}`}}return {text:'XiaoE Universal Home 已收到。真正的通用 AI Assistant 会在 AI Router backend 接通后启用。',meta:'Assistant · UI shell'}}
async function send(){if(sendLocked)return;const text=input.value.trim();if(!text)return;sendLocked=true;sendBtn.disabled=true;addMessage(text,'user');input.value='';releaseKeyboard();try{const reply=await routeMessage(text);addMessage(reply.text,'bot',reply.meta)}catch(e){console.error('XiaoE route failed:',e);addMessage('这次查询没有成功，我没有拿未验证的数据来回答。请再试一次，或进入 Evolution Project Workspace 查询。','bot','Routing · Failed')}finally{sendLocked=false;sendBtn.disabled=false}}
input.addEventListener('focus',()=>requestAnimationFrame(()=>{setTimeout(syncKeyboard,30);setTimeout(syncKeyboard,120);setTimeout(syncKeyboard,260)}));input.addEventListener('blur',()=>setTimeout(closeKeyboardUI,80));sendBtn.addEventListener('click',send);input.addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
window.addEventListener('load',()=>{const vv=window.visualViewport;stableViewportHeight=Math.max(window.innerHeight,(vv?.height||0)+(vv?.offsetTop||0));lockDocument();renderIdentity()});window.addEventListener('orientationchange',()=>setTimeout(()=>{const vv=window.visualViewport;stableViewportHeight=Math.max(window.innerHeight,(vv?.height||0)+(vv?.offsetTop||0));syncKeyboard()},250));window.addEventListener('resize',syncKeyboard);if(window.visualViewport){window.visualViewport.addEventListener('resize',syncKeyboard);window.visualViewport.addEventListener('scroll',syncKeyboard)}supabase.auth.onAuthStateChange(()=>renderIdentity());
</script>
</body>
</html>
