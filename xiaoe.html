<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050716" />
<title>小E · Evolution AI Assistant</title>
<style>
:root{--bg:#050716;--bg2:#0b1230;--card:rgba(14,22,58,.88);--line:rgba(116,127,255,.35);--text:#f7f8ff;--muted:#aeb8d8;--purple:#c05cff;--blue:#6ba8ff;--cyan:#30e2ee;--danger:#ff7b8f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100dvh;background:radial-gradient(circle at 15% 10%,rgba(168,85,247,.18),transparent 28%),radial-gradient(circle at 85% 20%,rgba(59,130,246,.16),transparent 30%),linear-gradient(160deg,#050716 0%,#0b1230 48%,#060919 100%)}
.shell{width:min(860px,100%);min-height:100dvh;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px}
.brand{display:flex;align-items:center;gap:11px}.orb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:radial-gradient(circle at 35% 30%,rgba(192,92,255,.6),rgba(40,90,190,.4) 45%,rgba(4,20,50,.95) 72%);border:1px solid rgba(94,207,255,.55);box-shadow:0 0 22px rgba(94,128,255,.32)}
.brand h1{font-size:22px;margin:0;letter-spacing:.5px}.brand p{margin:2px 0 0;font-size:11px;color:var(--muted);letter-spacing:1.5px}
.status{font-size:12px;color:var(--muted);padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.035)}
.card{background:linear-gradient(145deg,rgba(23,22,72,.92),rgba(7,19,52,.94));border:1px solid var(--line);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 38px rgba(0,0,0,.28)}
.login{padding:18px}.login h2{margin:0 0 6px;font-size:20px}.login p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
input,button{font:inherit}input{width:100%;border:1px solid rgba(120,137,255,.28);background:rgba(5,11,35,.75);color:#fff;border-radius:13px;padding:12px 13px;outline:none}input:focus{border-color:#729bff;box-shadow:0 0 0 3px rgba(80,123,255,.12)}
button{border:0;border-radius:13px;padding:12px 15px;color:#fff;font-weight:700;cursor:pointer;background:linear-gradient(90deg,#9b5cff,#4d8fff,#28dce8);box-shadow:0 8px 20px rgba(54,100,255,.22)}button.secondary{background:rgba(255,255,255,.06);border:1px solid rgba(138,151,255,.3);box-shadow:none}.error{color:var(--danger);font-size:12px;margin-top:10px;min-height:16px}
.chat{flex:1;min-height:0;display:none;flex-direction:column;overflow:hidden}.chat.active{display:flex}.messages{flex:1;min-height:52dvh;max-height:68dvh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.msg{max-width:86%;padding:11px 13px;border-radius:16px;line-height:1.48;font-size:14px;white-space:pre-wrap;word-break:break-word}.bot{align-self:flex-start;background:rgba(68,78,155,.22);border:1px solid rgba(123,139,255,.26);border-bottom-left-radius:5px}.user{align-self:flex-end;background:linear-gradient(135deg,rgba(156,76,255,.75),rgba(56,128,255,.75));border-bottom-right-radius:5px}.meta{font-size:10px;color:#aab5d4;margin-top:5px}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-top:1px solid rgba(128,145,255,.18)}.composer input{padding:13px 14px}
.quick{display:flex;gap:7px;overflow:auto;padding:0 12px 12px}.chip{flex:0 0 auto;border:1px solid rgba(116,138,255,.28);background:rgba(255,255,255,.04);box-shadow:none;color:#dfe5ff;padding:8px 10px;font-size:12px;border-radius:999px}
.footer{text-align:center;color:#8491b8;font-size:10px;padding:2px 0 0}.hidden{display:none!important}
@media(max-width:640px){.shell{padding-left:9px;padding-right:9px}.grid{grid-template-columns:1fr}.topbar{padding-top:4px}.brand h1{font-size:19px}.orb{width:42px;height:42px}.messages{min-height:55dvh;max-height:none}.msg{max-width:92%}.status{font-size:10px}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><div class="orb">E</div><div><h1>小E</h1><p>EVOLUTION AI ASSISTANT · 1.0</p></div></div>
    <div class="status" id="status">未登录</div>
  </div>

  <section class="card login" id="loginCard">
    <h2>登录小E</h2>
    <p>使用你现有 Evolution Supabase 登录帐号。第一版只开放查询，不会修改、删除或核销资料。</p>
    <div class="grid">
      <input id="email" type="email" autocomplete="username" placeholder="Email" />
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" />
      <button id="loginBtn">登录</button>
    </div>
    <div class="error" id="loginError"></div>
  </section>

  <section class="card chat" id="chatCard">
    <div class="messages" id="messages"></div>
    <div class="quick">
      <button class="chip" data-q="今天 redeem 多少？">今天核销</button>
      <button class="chip" data-q="列出所有门店">门店名单</button>
      <button class="chip" data-q="voucher summary">Voucher 汇总</button>
    </div>
    <div class="composer">
      <input id="messageInput" placeholder="问小E，例如：今天 redeem 多少？" />
      <button id="sendBtn">发送</button>
    </div>
  </section>

  <button class="secondary hidden" id="logoutBtn">退出登录</button>
  <div class="footer">小E 1.0 · Read-only mode · Evolution Optical</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://hukihbcyyqhanaqrizvm.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_kpPFeGYpedq2auo01Zo50A_aiSjdeVh';
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const $ = (id) => document.getElementById(id);
const loginCard = $('loginCard'), chatCard = $('chatCard'), logoutBtn = $('logoutBtn'), messages = $('messages'), status = $('status');
function addMessage(text, who='bot', meta='') { const wrap=document.createElement('div'); wrap.className=`msg ${who}`; wrap.textContent=text; if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;wrap.appendChild(m);} messages.appendChild(wrap);messages.scrollTop=messages.scrollHeight; }
function formatResult(payload){ let out=payload.answer||'已完成查询。'; if(Array.isArray(payload.by_branch)&&payload.by_branch.length){out+='\n\n'+payload.by_branch.map(x=>`${x.branch_name}: ${x.count}`).join('\n');} else if(Array.isArray(payload.data)&&payload.data.length){out+='\n\n'+payload.data.slice(0,12).map((x,i)=>{if(x.voucher_code)return `${i+1}. ${x.voucher_code} · ${x.customer_name||''} · ${x.status||''}`;if(x.partner_name)return `${i+1}. ${x.partner_name} · ${x.partner_code||''} · ${x.status||''}${x.remaining!=null?` · 剩余 ${x.remaining}`:''}`;if(x.branch_name)return `${i+1}. ${x.branch_name}${x.branch_code?` (${x.branch_code})`:''}`;return `${i+1}. ${JSON.stringify(x)}`;}).join('\n');} else if(payload.status_counts){out+='\n\n状态：\n'+Object.entries(payload.status_counts).map(([k,v])=>`${k}: ${v}`).join('\n');} return out; }
async function renderSession(){ const {data:{session}}=await supabase.auth.getSession(); if(session){loginCard.classList.add('hidden');chatCard.classList.add('active');logoutBtn.classList.remove('hidden');status.textContent='已连接';if(!messages.children.length)addMessage('你好，我是小E 1.0。\n目前先开放只读查询：Voucher、Partner、Branch 和 Redemption。');}else{loginCard.classList.remove('hidden');chatCard.classList.remove('active');logoutBtn.classList.add('hidden');status.textContent='未登录';}}
$('loginBtn').addEventListener('click',async()=>{$('loginError').textContent='';const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('loginError').textContent='请输入 Email 和 Password。';return;}$('loginBtn').disabled=true;$('loginBtn').textContent='登录中…';const {error}=await supabase.auth.signInWithPassword({email,password});$('loginBtn').disabled=false;$('loginBtn').textContent='登录';if(error){$('loginError').textContent=error.message;return;}await renderSession();});
async function sendMessage(text){const q=text.trim();if(!q)return;addMessage(q,'user');$('messageInput').value='';$('sendBtn').disabled=true;status.textContent='小E查询中…';try{const {data:{session}}=await supabase.auth.getSession();if(!session)throw new Error('登录已失效，请重新登录。');const res=await fetch(`${SUPABASE_URL}/functions/v1/xiaoe-chat`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({message:q})});const payload=await res.json();if(!res.ok||payload.success===false)throw new Error(payload.error||'查询失败');addMessage(formatResult(payload),'bot',payload.action||'xiaoe-chat');}catch(e){addMessage(`查询失败：${e.message||e}`,'bot');}finally{$('sendBtn').disabled=false;status.textContent='已连接';}}
$('sendBtn').addEventListener('click',()=>sendMessage($('messageInput').value));$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage(e.target.value);});document.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>sendMessage(btn.dataset.q||'')));logoutBtn.addEventListener('click',async()=>{await supabase.auth.signOut();messages.innerHTML='';await renderSession();});supabase.auth.onAuthStateChange(()=>renderSession());renderSession();
</script>
</body>
</html>
